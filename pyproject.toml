[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-coding"
version = "1.0.0"
description = "Auto-Coding v1"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
auto-coding = "auto_coding.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
